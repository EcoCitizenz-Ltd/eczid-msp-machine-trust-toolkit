name: MSP Portfolio Actions CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msp-portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Client Trust Baseline
        id: baseline
        uses: ./actions/client-trust-baseline
        with:
          client-id: ci-customer
          fail-on: never

      - name: Standard Drift
        id: drift
        uses: ./actions/standard-drift
        with:
          client-id: ci-customer
          fail-on: never

      - name: Evidence and QBR Pack
        id: evidence
        uses: ./actions/evidence-qbr-pack
        with:
          client-id: ci-customer
          profile: qbr
          fail-on: never

      - name: AI and Agent Estate
        id: ai
        uses: ./actions/ai-agent-estate
        with:
          client-id: ci-customer
          fail-on: never

      - name: Third-Party Reliance Gate
        id: reliance
        uses: ./actions/third-party-reliance
        with:
          client-id: ci-customer
          fail-on: never

      - name: Tenant Boundary Guard
        id: boundary
        uses: ./actions/tenant-boundary-guard
        with:
          client-id: ci-customer
          environment: test
          provider: generic
          expected-target: ci-target
          actual-target: ci-target
          fail-on-mismatch: "true"

      - name: Confirm portfolio outputs
        shell: bash
        run: |
          echo "baseline=${{ steps.baseline.outputs.result-state }}"
          echo "drift=${{ steps.drift.outputs.result-state }}"
          echo "evidence=${{ steps.evidence.outputs.result-state }}"
          echo "ai=${{ steps.ai.outputs.result-state }}"
          echo "reliance=${{ steps.reliance.outputs.result-state }}"
          echo "boundary=${{ steps.boundary.outputs.result-state }}"
          test -f eczid-msp-client-baseline.json
          test -f eczid-msp-standard-drift.json
          test -f eczid-msp-evidence-pack.json
          test -f eczid-msp-evidence-pack.md
          test -f eczid-msp-ai-agent-estate.json
          test -f eczid-msp-third-party-reliance.json
          test "${{ steps.boundary.outputs.result-state }}" != "BOUNDARY_MISMATCH"
          test "${{ steps.boundary.outputs.result-state }}" != "DECLARATION_MISMATCH"
