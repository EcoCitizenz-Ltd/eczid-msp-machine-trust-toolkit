name: MSP Wave A Actions CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msp-wave-a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  subaction-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        action:
          - path: actions/client-trust-baseline
            output: eczid-msp-client-baseline.json
          - path: actions/standard-drift
            output: eczid-msp-standard-drift.json
          - path: actions/evidence-qbr-pack
            output: eczid-msp-evidence-pack.json
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ${{ matrix.action.path }}
        id: action
        uses: ./${{ matrix.action.path }}
        with:
          client-id: ci-customer
          fail-on: never
      - name: Confirm primary output
        shell: bash
        run: |
          echo "state=${{ steps.action.outputs.result-state }}"
          test -f "${{ matrix.action.output }}"
