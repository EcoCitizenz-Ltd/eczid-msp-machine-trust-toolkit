name: Public Content Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  public-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run public-copy gate self-tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check encoding, claims, links, prices and register contract
        run: python scripts/check_public_copy.py
